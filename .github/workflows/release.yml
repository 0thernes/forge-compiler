name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify checkout matches release tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate declared npm
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${npm_version}" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "${npm_version}"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify tag and version
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/verify-release.mjs "$RELEASE_TAG"

      - name: Verify tag commit is on main
        if: ${{ github.event_name != 'pull_request' }}
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Verify release candidate
        run: npm run verify:quality

      - name: Build portable release
        run: npm run build
        env:
          BASE_PATH: ./

      - name: Package artifacts, SBOM, and checksums
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          archive="forge-compiler-v${version}.tar.gz"
          zipfile="forge-compiler-v${version}.zip"
          cli_archive="forge-compiler-cli-v${version}.tgz"
          sbom="forge-compiler-v${version}.cdx.json"
          install -m 0644 CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md dist/
          cp -R docs dist/docs
          node scripts/prepare-portable-readme.mjs dist/README.md
          node scripts/verify-artifact.mjs dist --portable
          node scripts/verify-docs.mjs dist
          tar -czf "${archive}" -C dist .
          (cd dist && zip -q -r "../${zipfile}" .)
          tar -tzf "${archive}" "./LICENSE" >/dev/null
          tar -tzf "${archive}" "./README.md" >/dev/null
          tar -tzf "${archive}" "./docs/RELEASING.md" >/dev/null
          unzip -tqq "${zipfile}" "LICENSE"
          unzip -tqq "${zipfile}" "README.md"
          unzip -tqq "${zipfile}" "docs/RELEASING.md"
          packed_name="$(node scripts/pack-cli.mjs --pack-destination .)"
          mv "${packed_name}" "${cli_archive}"
          tar -tzf "${cli_archive}" "package/bin/forge.mjs" >/dev/null
          cli_bin_listing="$(tar -tvzf "${cli_archive}" "package/bin/forge.mjs")"
          case "${cli_bin_listing}" in
            -rwxr-xr-x*) ;;
            *)
              echo "::error::Unexpected mode for package/bin/forge.mjs: ${cli_bin_listing}"
              exit 1
              ;;
          esac
          cli_smoke_root="$(mktemp -d)"
          tar -xzf "${cli_archive}" -C "${cli_smoke_root}"
          node scripts/verify-docs.mjs "${cli_smoke_root}/package"
          npm install \
            --prefix "${cli_smoke_root}/install" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --offline \
            --package-lock=false \
            "./${cli_archive}" >/dev/null
          printf 'print(40 + 2);' |
            "${cli_smoke_root}/install/node_modules/.bin/forge" run --json > cli-smoke.json
          node -e "const r = require('fs').readFileSync('cli-smoke.json', 'utf8'); const j = JSON.parse(r); if (!j.ok || j.data.result.output[0] !== '42') process.exit(1)"
          rm -rf "${cli_smoke_root}" cli-smoke.json
          npm sbom --sbom-format=cyclonedx > "${sbom}"
          sha256sum "${archive}" "${zipfile}" "${cli_archive}" "${sbom}" > SHA256SUMS
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            forge-compiler-v${{ steps.package.outputs.version }}.tar.gz
            forge-compiler-v${{ steps.package.outputs.version }}.zip
            forge-compiler-cli-v${{ steps.package.outputs.version }}.tgz
            forge-compiler-v${{ steps.package.outputs.version }}.cdx.json
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  validate-assets:
    name: Validate packaged assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .

      - name: Verify downloaded checksums
        run: sha256sum --check SHA256SUMS

  publish:
    name: Create or update draft release
    if: ${{ github.event_name != 'pull_request' }}
    needs: [verify, validate-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .

      - name: Verify downloaded checksums
        run: sha256sum --check SHA256SUMS

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "forge-compiler-v${VERSION}.tar.gz"
            "forge-compiler-v${VERSION}.zip"
            "forge-compiler-cli-v${VERSION}.tgz"
            "forge-compiler-v${VERSION}.cdx.json"
            "SHA256SUMS"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::Refusing to replace assets on an already-published release"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "FORGE v${VERSION}"
          fi
